name: FA
options:
  bundleIdPrefix: com.ichxse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple team ID here (or pick it in Xcode under Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  FA:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Wallpapers/**"
      - path: App/Wallpapers
        type: folder
        buildPhase: resources
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FA
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [fa]
        NSPhotoLibraryUsageDescription: Pick photos to add to your wallpaper rotation.
    entitlements:
      path: App/FA.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ichxse.fa]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ichxse.fa
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: FAWidget

  FAWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: FA Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/FAWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ichxse.fa]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ichxse.fa.widget
        TARGETED_DEVICE_FAMILY: "1"
